[project]
name = "md-sf2-tooling"
version = "0.1.0"
description = "Reproducible reverse-engineering harness for Shining Force II"
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.25,<5",
]

[project.scripts]
sf2 = "sf2tool.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf2tool"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
