name: Public checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-inputs:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint maintained Python
        run: uv run ruff check src tests/python

      - name: Run tracked-input harness tests
        run: uv run pytest tests/python/test_native_harness.py

      - name: Verify design-contract traceability
        run: uv run sf2 design-contracts test
