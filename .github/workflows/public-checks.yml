name: Public checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracked-inputs:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"
      DOTNET_CLI_HOME: ${{ github.workspace }}/../sf2-dotnet-cli-home
      NUGET_PACKAGES: ${{ github.workspace }}/local/nuget-packages
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/local/nuget-http-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.204
            8.0.424
          cache: true
          cache-dependency-path: remake/**/packages.lock.json

      - name: Select installed shared .NET CLI
        shell: pwsh
        run: |
          $dotnetBinary = (Get-Command dotnet -CommandType Application).Source
          "DOTNET_BIN=$dotnetBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint maintained Python
        run: uv run ruff check src tests/python

      - name: Run tracked-input harness tests
        run: uv run pytest tests/python/test_native_harness.py

      - name: Verify protected CLI and process environments
        run: uv run pytest tests/python/test_dotnet_environment.py tests/python/test_remake_godot.py tests/python/test_godot_ai_probe.py

      - name: Verify remake architecture, planner, and asset preflight
        run: uv run pytest tests/python/test_remake_architecture.py tests/python/test_verification_plan.py tests/python/test_remake_assets.py

      - name: Verify design-contract traceability
        run: uv run sf2 design-contracts test

      - name: Restore remake dependencies
        working-directory: remake
        run: '& $env:DOTNET_BIN restore Sf2.Remake.sln --locked-mode'

      - name: Build remake solution
        working-directory: remake
        run: '& $env:DOTNET_BIN build Sf2.Remake.sln --configuration Release --no-restore'

      - name: Test remake solution
        working-directory: remake
        run: '& $env:DOTNET_BIN test Sf2.Remake.sln --configuration Release --no-build --no-restore'
